name: Medex Scraper

on:
  workflow_dispatch:

jobs:

  scrape:

    strategy:
      fail-fast: false

      matrix:
        batch:
          - [6000,6300]
          - [6300,6600]
          - [6600,6900]
          - [6900,7200]
          - [7200,7500]
          - [7500,7800]
          - [7800,8100]
          - [8100,8400]
          - [8400,8700]
          - [8700,9000]

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: browser-actions/setup-chrome@v1

      - name: Install
        run: |
          pip install -r requirements.txt

      - name: Run Scraper
        run: |
          python scripts/scrape.py \
          ${{ matrix.batch[0] }} \
          ${{ matrix.batch[1] }}

      - name: Upload Excel
        uses: actions/upload-artifact@v4
        with:
          name: output-${{ matrix.batch[0] }}
          path: data/output/
