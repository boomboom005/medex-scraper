name: Medex Scraper

on:
  workflow_dispatch:

jobs:

  scrape:

    strategy:
      fail-fast: false

      matrix:
        batch:
          - [0,300]
          - [300,600]
          - [600,900]
          - [900,1200]
          - [1200,1500]
          - [1500,1800]
          - [1800,2100]
          - [2100,2400]
          - [2400,2700]
          - [2700,3000]

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: browser-actions/setup-chrome@v1

      - name: Install
        run: |
          pip install -r requirements.txt

      - name: Run Scraper
        run: |
          python scripts/scrape.py \
          ${{ matrix.batch[0] }} \
          ${{ matrix.batch[1] }}

      - name: Upload Excel
        uses: actions/upload-artifact@v4
        with:
          name: output-${{ matrix.batch[0] }}
          path: data/output/
